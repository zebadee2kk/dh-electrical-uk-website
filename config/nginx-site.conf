# Full production config for DH Electrical Services
# WP-Super-Cache disk cache + Let's Encrypt SSL

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name dh-electrical.uk www.dh-electrical.uk;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dh-electrical.uk www.dh-electrical.uk;

    # SSL (managed by Certbot auto-renewal)
    ssl_certificate     /etc/letsencrypt/live/dh-electrical.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dh-electrical.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Cloudflare real-IP (for correct visitor IP logging)
    include /etc/nginx/conf.d/cloudflare-real-ip.conf;

    root /var/www/dh-electrical.uk;
    index index.php;

    client_max_body_size 32m;

    # WP-Super-Cache disk cache lookup
    set $cache_uri $request_uri;
    if ($request_method = POST)         { set $cache_uri 'null cache'; }
    if ($query_string != "")            { set $cache_uri 'null cache'; }
    if ($http_cookie ~* "comment_author_|wordpress_logged_in_|wp-postpass_") {
        set $cache_uri 'null cache';
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /wp-content/cache/supercache/$host/$cache_uri/index.html
                  $uri $uri/ /index.php?$args;
    }

    location ^~ /wp-content/cache/supercache/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # PHP processing
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Block PHP execution in uploads (drop-in defense)
    location ~* /wp-content/uploads/.*\.php$ {
        deny all;
        return 403;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # Hide dotfiles except .well-known (for Certbot challenges)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Block xmlrpc (common attack vector)
    location = /xmlrpc.php { deny all; return 403; }

    # Static asset caching
    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    access_log /var/log/nginx/dh-electrical.uk.access.log;
    error_log  /var/log/nginx/dh-electrical.uk.error.log;
}